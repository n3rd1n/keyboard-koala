[package]
name = "keyboardkoala"
version = "0.2.0"
description = "Background keyboard launcher for apps and commands"
authors = ["KeyboardKoala contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "keyboardkoala_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.5", features = [] }
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-autostart = "2.5"
tauri-plugin-shell = "2.3"
tauri-plugin-fs = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
walkdir = "2"
thiserror = "2"
